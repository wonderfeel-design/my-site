<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="assets/data.js"></script>
<script src="assets/theme.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-name"><b>Katerina Akhmad</b><span>UX&nbsp;Research</span></a>
    <div class="nav-links">
      <a href="index.html#work">Work</a>
      <a href="index.html#about" class="hide-sm">About</a>
      <a href="mailto:ekatakhm@gmail.com" class="nav-cta">Get in touch</a>
    </div>
  </div>
</nav>

<main id="main"></main>

<footer class="foot">
  <div class="foot-inner">
    <span>© 2026 Katerina Akhmad · Barcelona</span>
    <span>Cases reflect real engagements. Some client details simplified.</span>
  </div>
</footer>

<div id="tweaks-root"></div>

<script>
(function () {
  const KA = window.KA, C = KA.categories;
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const idx = KA.cases.findIndex(c => c.id === id);
  const c = idx >= 0 ? KA.cases[idx] : KA.cases[0];
  const cat = C[c.category];
  const col = `oklch(0.58 0.105 ${cat.hue})`;
  document.title = `${c.client} — ${c.title} · Katerina Akhmad`;

  const esc = (s) => s;
  const main = document.getElementById("main");

  const metricCells = c.metrics.map(m =>
    `<div class="ms-cell"><div class="ms-v">${m.value}</div><div class="ms-l">${m.label}</div></div>`).join("");
  const stripClass = c.metrics.length === 3 ? "metric-strip cols-3" : "metric-strip";

  const starOrder = [["S", "Situation"], ["T", "Task"], ["A", "Action"], ["R", "Result"]];
  const starRows = starOrder.map(([n, k]) =>
    `<div class="star reveal">
       <div class="star-k"><span class="n">${n}</span>${k}</div>
       <div class="star-t">${c.star[k.toLowerCase()]}</div>
     </div>`).join("");

  let conceptsBlock = "";
  if (c.concepts) {
    conceptsBlock = `
     <section class="section" style="padding-top:0;">
       <div class="wrap">
         <div class="eyebrow" style="margin-bottom:8px;">Product–market fit · validated concepts</div>
         <div class="concepts">
           ${c.concepts.map(cn => `
             <div class="concept reveal">
               <h4>${cn.name}</h4>
               <dl>
                 <dt>Value proposition</dt><dd>${cn.vp}</dd>
                 <dt>Target audience</dt><dd>${cn.ta}</dd>
                 <dt>Confirmed use cases</dt><dd>${cn.confirmed}</dd>
                 <dt>Focus markets</dt><dd>${cn.markets}</dd>
               </dl>
             </div>`).join("")}
         </div>
       </div>
     </section>`;
  }

  const shots = c.shots.map(s =>
    `<div><image-slot id="shot-${s.id}" shape="rounded" radius="4"
        placeholder="Drop: ${s.cap}"></image-slot>
     <span class="shot-cap">${s.cap}</span></div>`).join("");

  const artifacts = c.artifacts.map(a => `<li>${a}</li>`).join("");

  const next = KA.cases[(idx + 1) % KA.cases.length];
  const nextCat = C[next.category];

  main.innerHTML = `
    <header class="detail-hero" style="--cat:${col};">
      <div class="wrap">
        <a class="back-link" href="index.html#work"><span class="ar">←</span> All work</a>
        <div class="detail-cat"><span class="case-cat" style="--cat:${col}; color:${col};">${cat.label}</span></div>
        <h1><span class="client">${c.client}.</span> ${c.title}</h1>
        <p class="detail-lede">${c.summary}</p>
        <div class="detail-meta">
          <div class="dm"><div class="k">Method</div><div class="v">${c.method}</div></div>
          <div class="dm"><div class="k">Sample & scope</div><div class="v">${c.sample}</div></div>
          <div class="dm"><div class="k">Domain</div><div class="v">${c.year}${c.clientNote ? " · " + c.clientNote : ""}</div></div>
        </div>
      </div>
    </header>

    <section class="section" style="padding-top:calc(40px * var(--space));">
      <div class="wrap">
        <div class="eyebrow" style="margin-bottom:6px;">Impact</div>
        <div class="${stripClass}">${metricCells}</div>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="wrap">
        <div class="eyebrow" style="margin-bottom:22px;">The work · Situation → Task → Action → Result</div>
        ${starRows}
      </div>
    </section>

    ${conceptsBlock}

    <section class="section" style="padding-top:0;">
      <div class="wrap">
        <div class="section-head"><div><div class="eyebrow">Deliverables</div><h2>What I handed over.</h2></div></div>
        <div class="artifacts-grid">
          <ul class="artifact-list reveal">${artifacts}</ul>
          <div class="shots reveal">${shots}</div>
        </div>
      </div>
    </section>

    <a class="next-case" href="case.html?id=${next.id}" style="display:block; --cat:oklch(0.58 0.105 ${nextCat.hue});">
      <div class="wrap">
        <div class="next-inner">
          <div>
            <div class="lbl">Next case · ${nextCat.label}</div>
            <h3>${next.title}</h3>
          </div>
          <span class="go">${next.client} <span class="ar">→</span></span>
        </div>
      </div>
    </a>`;

  // reveal on scroll
  if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(n => io.observe(n));
  } else {
    document.querySelectorAll(".reveal").forEach(n => n.classList.add("in"));
  }
  window.scrollTo(0, 0);
})();
</script>

<script src="assets/image-slot.js"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="assets/tweaks-panel.jsx"></script>
<script type="text/babel" src="assets/tweaks-app.jsx"></script>
</body>
</html>
